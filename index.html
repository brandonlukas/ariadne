<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ariadne</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #1b1a17;
      --gray: #6e6c65;
      --faint: #a6a49c;
      --hairline: #e9e8e4;
      --hover: #f6f5f2;
      --sel: #f0efeb;
      --thread: #b41f3a;
      --ok: #2e8b57;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font: 13px/1.5 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #frame { display: flex; flex-direction: column; height: 100vh; }

    nav {
      display: flex; align-items: baseline; gap: 14px;
      padding: 15px 24px 13px; border-bottom: 1px solid var(--hairline);
      flex-shrink: 0;
    }
    .wordmark { font-size: 14px; letter-spacing: 0.02em; }
    .wordmark i { font-style: normal; color: var(--thread); }
    nav .tagline { color: var(--faint); font-size: 12px; }
    nav .right { margin-left: auto; color: var(--faint); font-size: 12px;
      font-variant-numeric: tabular-nums; display: flex; gap: 14px; align-items: baseline; }
    nav .right b { font-weight: 400; color: var(--gray); }
    .navlink { color: var(--faint); text-decoration: none; }
    .navlink:hover { color: var(--gray); }

    #main { flex: 1; display: flex; min-height: 0; }

    #sidebar { width: 316px; flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--hairline); }
    #seed-form { display: flex; gap: 8px; padding: 18px 18px 0 22px; }
    #seed-input { flex: 1; background: var(--paper); border: 1px solid var(--hairline);
      border-radius: 999px; padding: 8px 14px; color: var(--ink); font: inherit; outline: none; }
    #seed-input::placeholder { color: var(--faint); }
    #seed-input:focus { border-color: var(--faint); }
    button { font: inherit; cursor: pointer; }
    #add-seed { background: var(--paper); color: var(--ink); border: 1px solid var(--hairline);
      border-radius: 999px; padding: 0 16px; }
    #add-seed:hover { border-color: var(--faint); }
    #picker { list-style: none; margin: 8px 0 0; padding: 0 18px 0 22px; display: flex;
      flex-direction: column; gap: 4px; }
    #picker:empty { display: none; }
    #picker li { display: flex; align-items: baseline; gap: 8px; cursor: pointer;
      border: 1px dashed var(--hairline); border-radius: 8px; padding: 6px 10px;
      font-size: 12px; }
    #picker li:hover { background: var(--hover); border-style: solid; }
    #picker .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #picker .y { color: var(--faint); white-space: nowrap; }
    #seed-chips { list-style: none; margin: 10px 0 0; padding: 0 18px 0 22px; display: flex;
      flex-direction: column; gap: 5px; }
    #seed-chips li { display: flex; align-items: center; gap: 8px;
      border: 1px solid var(--hairline);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; }
    #seed-chips li::before { content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--thread); flex-shrink: 0; }
    #seed-chips .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #seed-chips .y { color: var(--faint); }
    #seed-chips button { background: none; border: none; color: var(--faint); padding: 0 2px; font-size: 14px; }
    #seed-chips button:hover { color: var(--ink); }
    #weave { margin: 12px 18px 0 22px; padding: 9px; background: var(--thread); color: #fff;
      border: none; border-radius: 999px; letter-spacing: 0.01em; }
    #weave:hover:not(:disabled) { background: #c72a48; }
    #weave:disabled { background: var(--hover); color: var(--faint); cursor: default; }
    #status { padding: 8px 18px 12px 22px; font-size: 11px; color: var(--faint); min-height: 28px; }
    #status.error { color: var(--thread); }
    #ai { padding: 0 18px 6px 22px; font-size: 11px; }
    #ai > button { background: none; border: none; padding: 0; font-size: 11px; width: 100%;
      color: var(--faint); display: flex; align-items: center; gap: 6px; }
    #ai > button:hover { color: var(--gray); }
    #ai > button.on { color: var(--gray); }
    #ai .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hairline);
      flex-shrink: 0; }
    #ai > button.on .dot { background: var(--ok); box-shadow: 0 0 0 3px
      color-mix(in srgb, var(--ok) 18%, transparent); }
    #alex-status { margin-left: auto; color: var(--faint); }
    #ai .grp { margin-top: 10px; }
    #ai .grp-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--faint); }
    #ai .grp-label i { font-style: normal; text-transform: none; letter-spacing: 0; }
    #ai .row { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    #ai .row label { width: 34px; flex-shrink: 0; color: var(--gray); }
    #ai .row .slot { flex: 1; min-width: 0; display: flex; }
    #ai .row .slot > * { flex: 1; min-width: 0; }
    #ai input { flex: 1; min-width: 0; background: var(--paper); color: var(--ink);
      border: 1px solid var(--hairline); border-radius: 999px; padding: 4px 10px;
      font: inherit; font-size: 11px; outline: none; }
    #ai input:focus { border-color: var(--faint); }
    #ai .keychip { display: flex; align-items: center; border: 1px solid var(--hairline);
      border-radius: 999px; padding: 3px 4px 3px 10px; background: var(--hover); }
    #ai .keychip .mask { flex: 1; color: var(--gray); letter-spacing: 0.05em;
      overflow: hidden; white-space: nowrap; }
    #ai .keychip .forget { background: none; border: none; color: var(--faint);
      font-size: 10.5px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
    #ai .keychip .forget:hover { color: var(--thread); background: var(--sel); }
    #intent-line { padding: 0 18px 10px 22px; font-size: 11.5px; font-style: italic;
      color: var(--gray); }
    #intent-line[hidden] { display: none; }
    #facts { padding: 0 18px 10px 22px; font-size: 11px; color: var(--gray); }
    #facts b { font-weight: 400; color: var(--faint); }
    #tabs { display: flex; gap: 14px; padding: 0 18px 8px 22px; font-size: 12px; }
    #tabs[hidden] { display: none; }
    #tabs button { background: none; border: none; padding: 0; color: var(--faint); }
    #tabs button.on { color: var(--ink); }
    #tabs button:hover { color: var(--gray); }
    #lenses { flex: 1; overflow-y: auto; border-top: 1px solid var(--hairline);
      padding: 8px 18px 10px 22px; font-size: 11px; color: var(--gray); }
    #lenses .row { display: flex; align-items: center; gap: 8px; padding: 2.5px 0; cursor: pointer; }
    #lenses .row .n { width: 140px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex-shrink: 0; }
    #lenses .row:hover .n { color: var(--ink); }
    #lenses .row .track { flex: 1; height: 2px; background: var(--hairline); }
    #lenses .row .track i { display: block; height: 100%; background: var(--ink); }
    #lenses .row em { font-style: normal; width: 22px; text-align: right; color: var(--faint);
      font-variant-numeric: tabular-nums; }
    #lenses .row.lit .n, #lenses .row.lit em { color: var(--thread); }
    #lenses .row.lit .track i { background: var(--thread); }

    #list-tools { display: flex; gap: 12px; align-items: center; padding: 0 18px 8px 22px; }
    #list-tools[hidden] { display: none; }
    #find { flex: 1; min-width: 0; background: var(--paper); border: 1px solid var(--hairline);
      border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 11px;
      color: var(--ink); outline: none; }
    #find::placeholder { color: var(--faint); }
    #find:focus { border-color: var(--faint); }
    #list-tools #bridges { background: none; border: 1px solid var(--hairline);
      border-radius: 999px; padding: 2px 10px; font-size: 11px; color: var(--gray);
      white-space: nowrap; }
    #list-tools #bridges:hover { border-color: var(--faint); }
    #list-tools #bridges.on { background: var(--thread); border-color: var(--thread); color: #fff; }
    #preset { padding: 0 18px 8px 22px; font-size: 11px; }
    #preset .seg { display: inline-flex; border: 1px solid var(--hairline);
      border-radius: 999px; padding: 2px; gap: 2px; }
    #preset .seg button { background: none; border: none; border-radius: 999px;
      padding: 2px 10px; font-size: 11px; color: var(--gray); }
    #preset .seg button:hover { color: var(--ink); }
    #preset .seg button.on { background: var(--sel); color: var(--ink); }
    #order-line { margin-top: 6px; padding-left: 4px; color: var(--faint);
      display: flex; gap: 10px; align-items: baseline; }
    #order-line[hidden] { display: none; }
    #order-line button { background: none; border: none; padding: 0; font-size: 11px;
      color: var(--faint); }
    #order-line button.on { color: var(--thread); }
    #order-line button:hover { color: var(--gray); }

    #ranked { list-style: none; margin: 0; padding: 0; flex: 1; overflow-y: auto;
      border-top: 1px solid var(--hairline); }
    #ranked li[hidden] { display: none; }
    #ranked li { display: flex; gap: 12px; padding: 11px 18px 11px 22px;
      border-bottom: 1px solid var(--hairline); cursor: pointer; }
    #ranked li:hover, #ranked li.hover { background: var(--hover); }
    #ranked li.active { background: var(--sel); }
    #ranked .rank { color: var(--faint); font-size: 11px; padding-top: 2px; min-width: 16px;
      text-align: right; font-variant-numeric: tabular-nums; }
    #ranked .body { flex: 1; min-width: 0; }
    #ranked .title { font-size: 12.5px; line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    #ranked .meta { font-size: 11px; color: var(--gray); margin-top: 2px; }
    #ranked .venue { font-size: 10.5px; color: var(--faint); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    #ranked .seed-mark { color: var(--thread); }
    #ranked .sc { color: var(--faint); font-size: 11px; padding-top: 2px;
      font-variant-numeric: tabular-nums; }

    #stage { flex: 1; position: relative; overflow: hidden; min-width: 0; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    #modes { position: absolute; top: 16px; left: 20px; display: none; gap: 16px; }
    #modes button { background: none; border: none; padding: 0; color: var(--faint);
      letter-spacing: 0.01em; }
    #modes button.on { color: var(--ink); }
    #modes button:hover { color: var(--gray); }

    #years { position: absolute; left: 20px; bottom: 46px; display: none;
      align-items: flex-end; gap: 1px; cursor: crosshair; touch-action: none; }
    #years div { width: 4px; border-radius: 1px; }
    #years div.seed-year { box-shadow: 0 3px 0 var(--thread); } /* seeds live here */
    #year-ticks { position: absolute; left: 20px; bottom: 34px; height: 10px; display: none;
      font-size: 9px; color: var(--faint); font-variant-numeric: tabular-nums; }
    #year-ticks span { position: absolute; top: 0; transform: translateX(-50%); }
    #brush-readout { position: absolute; left: 20px; bottom: 88px; display: flex;
      align-items: center; gap: 8px; font-size: 11px; color: var(--ink);
      border: 1px solid var(--hairline); border-radius: 999px; padding: 3px 10px;
      background: var(--paper); }
    #brush-readout[hidden] { display: none; }
    #brush-readout b { font-weight: 400; color: var(--thread); font-variant-numeric: tabular-nums; }
    #brush-readout .x { color: var(--faint); cursor: pointer; }
    #brush-readout .x:hover { color: var(--ink); }
    #legend { position: absolute; left: 20px; bottom: 16px; font-size: 11px; color: var(--gray);
      display: none; align-items: center; gap: 8px; pointer-events: none; }
    #legend .ramp { width: 84px; height: 6px; border-radius: 3px;
      background: linear-gradient(to right, #a8a494, #69665b, #1c1b18); }
    #legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--thread); margin: 0 3px 0 10px; }
    #hint { position: absolute; bottom: 16px; right: 16px;
      font-size: 11px; color: var(--faint); pointer-events: none; white-space: nowrap;
      display: none; }

    #toolbar { position: absolute; right: 16px; top: 14px; display: none; gap: 8px; }
    .pill { border: 1px solid var(--hairline); background: var(--paper); border-radius: 999px;
      padding: 7px 15px; font-size: 12px; color: var(--ink); text-decoration: none;
      white-space: nowrap; }
    .pill:hover { border-color: var(--faint); }

    #empty { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: var(--faint); font-size: 13px; text-align: center;
      pointer-events: none; line-height: 1.8; }
    #empty button { pointer-events: auto; background: none; border: none; padding: 0;
      margin-top: 10px; font: inherit; color: var(--thread); }
    #empty button:hover { text-decoration: underline; }
    #empty button:disabled { color: var(--faint); text-decoration: none; }
    #gallery { position: absolute; inset: 0; overflow-y: auto; background: var(--paper);
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 34px 28px; padding: 56px 28px 130px; align-content: start; }
    #gallery[hidden] { display: none; }
    .card { cursor: pointer; }
    .card .fig { height: 140px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 9px; }
    .card .fig img { max-width: 100%; max-height: 140px; }
    .card.nofig .fig, .card.pending .fig { border: 1px solid var(--hairline);
      border-radius: 8px; color: var(--faint); font-size: 10px; letter-spacing: 0.06em; }
    .card .t { font-size: 11.5px; line-height: 1.4; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card:hover .t { text-decoration: underline; }
    .card .m { font-size: 10.5px; color: var(--faint); margin-top: 2px;
      font-variant-numeric: tabular-nums; }
    .card .m .seed { color: var(--thread); }
    .card .v { font-size: 10px; color: var(--faint); overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .card.ghost { opacity: 0.25; }
    .card.nofig { order: 1; } /* figureless papers settle at the end of the wall */
    #stage.woven #modes, #stage.woven #legend, #stage.woven #toolbar, #stage.woven #years { display: flex; }
    #stage.woven #hint { display: block; }
    #stage.woven #year-ticks { display: block; }
    #stage.gallery #years, #stage.gallery #year-ticks, #stage.gallery #legend,
    #stage.gallery #brush-readout { display: none; }
    #stage.woven #empty { display: none; }

    #panel { position: absolute; top: 0; right: 0; bottom: 0; width: 384px;
      background: var(--paper); border-left: 1px solid var(--hairline);
      padding: 22px 30px; overflow-y: auto;
      transform: translateX(102%); transition: transform 0.28s cubic-bezier(.2,.7,.2,1); }
    #panel.open { transform: none; box-shadow: -24px 0 48px rgba(27,26,23,0.05); }
    @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
    #back { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--hairline);
      background: var(--paper); color: var(--ink); font-size: 14px;
      margin-bottom: 18px; display: flex; align-items: center; justify-content: center; }
    #back:hover { border-color: var(--faint); }
    #panel h2 { margin: 0 0 6px; font-size: 21px; line-height: 1.3; font-weight: 500;
      letter-spacing: -0.01em; text-wrap: balance; }
    #panel .byline { color: var(--gray); font-size: 13px; }
    #panel .date { color: var(--gray); font-size: 13px; margin-bottom: 18px; }
    #panel .desc { font-size: 13.5px; line-height: 1.65; color: #3d3b35; margin: 0 0 18px;
      max-height: 220px; overflow-y: auto; }
    #panel .why { font-size: 13px; line-height: 1.6; color: var(--gray); margin: 0 0 22px; }
    #panel .why b { font-weight: 400; color: var(--thread); }
    .meter { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 11px;
      color: var(--gray); }
    .meter span { width: 88px; }
    .meter .track { flex: 1; height: 2px; background: var(--hairline); }
    .meter .track i { display: block; height: 100%; background: var(--ink); }
    .meter em { font-style: normal; width: 32px; text-align: right; color: var(--faint);
      font-variant-numeric: tabular-nums; }
    #panel .pills { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
    #panel .ch { font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--faint); padding: 22px 0 5px; }
    #panel .conn { display: flex; gap: 10px; align-items: baseline; padding: 4.5px 0;
      font-size: 12px; cursor: pointer; border-top: 1px solid var(--hairline); }
    #panel .conn .y { color: var(--faint); font-size: 10.5px; min-width: 30px;
      font-variant-numeric: tabular-nums; }
    #panel .conn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    #panel .conn:hover .t { color: var(--thread); }
    button:focus-visible, a:focus-visible, li:focus-visible, input:focus-visible {
      outline: 2px solid var(--thread); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="frame">
    <nav>
      <span class="wordmark">ariadne<i>.</i></span>
      <span class="tagline">a thread through the literature</span>
      <span class="right">
        <a class="navlink" href="about.html">how it works</a>
        <a class="navlink" href="privacy.html">privacy</a>
        <a class="navlink" href="terms.html">terms</a>
        <span id="counts"></span>
      </span>
    </nav>
    <div id="main">
      <aside id="sidebar">
        <form id="seed-form">
          <input id="seed-input" placeholder="DOI or paper title…" />
          <button id="add-seed">add</button>
        </form>
        <ul id="picker"></ul>
        <ul id="seed-chips"></ul>
        <button id="weave" disabled>weave the graph</button>
        <div id="status"></div>
        <div id="ai">
          <button id="ai-toggle"><span class="dot"></span><span id="ai-status">ai off</span><span id="alex-status"></span></button>
          <div id="ai-fields" hidden>
            <div class="grp">
              <div class="grp-label">assistant · openrouter <i>— reads your seeds, explains papers</i></div>
              <div class="row"><label>key</label><span class="slot" id="ai-key-slot"></span></div>
              <div class="row"><label>model</label><input id="ai-model" list="ai-models" placeholder="blank picks a free one" /></div>
              <datalist id="ai-models"></datalist>
            </div>
            <div class="grp">
              <div class="grp-label">data · openalex <i>— optional, 10× the daily budget</i></div>
              <div class="row"><label>key</label><span class="slot" id="alex-key-slot"></span></div>
            </div>
          </div>
        </div>
        <div id="intent-line" hidden></div>
        <div id="facts" hidden></div>
        <div id="tabs" hidden>
          <button data-t="papers" class="on">papers</button>
          <button data-t="venues">venues</button>
          <button data-t="authors">authors</button>
        </div>
        <div id="list-tools" hidden>
          <input id="find" placeholder="filter…" />
          <button id="bridges" hidden title="only papers citing several of your seeds">⋈ bridges</button>
        </div>
        <div id="preset" hidden>
          <div class="seg">
            <button data-a="canon" class="on" title="the influence map — what carries this literature">canon</button>
            <button data-a="groundwork" title="what your seeds are built on — ancestry, two hops deep">groundwork</button>
            <button data-a="since" title="what came after your seeds">since</button>
            <button data-a="now" title="the newest work in the conversation">now</button>
          </div>
          <div id="order-line" hidden>
            <span>order ·</span>
            <button id="order-score" class="on" title="ranked by load-bearing score">influence</button>
            <button id="oldest" title="chronological — the ancestry in order">oldest first</button>
          </div>
        </div>
        <ol id="ranked"></ol>
        <div id="lenses" hidden></div>
      </aside>
      <main id="stage">
        <canvas id="canvas"></canvas>
        <div id="empty"><div>Add one or more seed papers,<br />then weave the graph.<br />
          <button id="demo">or try it — deep learning + imagenet</button></div></div>
        <div id="gallery" hidden></div>
        <div id="modes">
          <button data-m="constellation" class="on">constellation</button>
          <button data-m="circle">circle</button>
          <button data-m="sphere">sphere</button>
          <button data-m="timeline">timeline</button>
          <button data-m="gallery">gallery</button>
        </div>
        <div id="years"></div>
        <div id="year-ticks"></div>
        <div id="brush-readout" hidden></div>
        <div id="legend">
          <span id="year-min"></span><span class="ramp"></span><span id="year-max"></span>
          <span class="dot"></span><span>seed</span>
          <span style="margin-left:10px">size — influence</span>
        </div>
        <div id="hint"></div>
        <div id="toolbar">
          <button class="pill" id="copy-link">copy link</button>
          <button class="pill" id="export-md">export .md</button>
          <button class="pill" id="export-bib">export .bib</button>
          <button class="pill" id="export-json">export .json</button>
        </div>
        <div id="panel">
          <button id="back" aria-label="close">←</button>
          <div id="panel-body"></div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
